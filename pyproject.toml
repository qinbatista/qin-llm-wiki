[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qin-llm-wiki"
version = "1.1.0"
description = "A privacy-safe, AI-first Obsidian project memory architecture"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Qin"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
qin-llm-wiki = "qin_llm_wiki.cli:main"

[tool.setuptools.package-data]
qin_llm_wiki = ["templates/vault/**/*"]
